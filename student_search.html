<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Search</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="dashboard.html">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://evbjulsahncllewwvlxp.supabase.co">
<style>
  :root{
    --ink:#262624; --ink-2:#3a3835;
    --paper:#f2efe8; --card:#faf8f3;
    --line:rgba(38,38,36,0.16);
    --gold:#8b1f1f; --gold-2:#6f1818; --gold-soft:rgba(139,31,31,0.13);
    --success:#2e7d52; --success-soft:rgba(46,125,82,0.12);
    --error:#8b1f1f; --error-soft:rgba(139,31,31,0.11);
    --muted:#6d6c68;
    --cream-bg-1:#f2efe8; --cream-bg-2:#f7f4ee;
    --on-accent:#f6f2ea;
    --shadow-sm:0 1px 2px rgba(40,40,38,0.10);
    --shadow-md:0 8px 24px rgba(40,40,38,0.14);
    --shadow-lg:0 20px 50px rgba(40,40,38,0.18);
  }
  body.dark{
    --ink:#eeece7; --ink-2:#e2dfd8;
    --paper:#1a1a1a; --card:#232323;
    --line:rgba(238,236,231,0.14);
    --gold:#c0392b; --gold-2:#9c2f24; --gold-soft:rgba(192,57,43,0.20);
    --success:#3fa873; --success-soft:rgba(63,168,115,0.18);
    --error:#c0392b; --error-soft:rgba(192,57,43,0.18);
    --muted:#a3a09a;
    --cream-bg-1:#1a1a1a; --cream-bg-2:#212121;
    --on-accent:#f6f2ea;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg:0 20px 50px rgba(0,0,0,0.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(139,31,31,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(139,31,31,0.06), transparent 45%),
      linear-gradient(160deg, var(--cream-bg-1), var(--cream-bg-2));
    color:var(--ink);
    min-height:100vh;
    padding:32px 24px 64px;
    transition:background .2s ease, color .2s ease;
  }
  [dir="rtl"] body{ font-family:'Cairo','Inter',sans-serif; }
  .num{ font-family:'Space Grotesk',sans-serif; }

  .topbar{
    max-width:1100px; margin:0 auto 26px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:var(--gold); opacity:0.92;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(139,31,31,0.35);
  }
  .brand-mark svg{ width:22px; height:22px; }
  .brand-mark svg path{ stroke:var(--on-accent) !important; }
  .brand-eyebrow{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:2px; }
  [dir="rtl"] .brand-eyebrow{ letter-spacing:0; }
  .brand h1{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--gold-2); letter-spacing:-0.01em; }
  [dir="rtl"] .brand h1{ font-family:'Cairo',serif; letter-spacing:0; }
  .brand p{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .company-badge{
    font-size:10px; font-weight:700; color:var(--gold); background:var(--gold-soft);
    padding:3px 10px; border-radius:999px; letter-spacing:0.05em;
    border:1px solid rgba(139,31,31,0.2);
  }
  .topbar-actions{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .updated-note{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .updated-note::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px var(--success-soft); }
  .scanner-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:10px;
    background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
    color:var(--on-accent); font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    text-decoration:none; box-shadow:0 6px 16px rgba(139,31,31,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .scanner-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(139,31,31,0.35); }
  .scanner-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .icon-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:42px; height:42px; padding:0 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; font-weight:700; cursor:pointer;
    transition:all .15s ease;
  }
  .icon-toggle-btn:hover{ border-color:var(--gold); color:var(--gold-2); }

  .wrap{ max-width:1100px; margin:0 auto; }
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px; box-shadow:var(--shadow-lg);
    transition:background .2s ease, border-color .2s ease;
  }

  .controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .grade-select{
    padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; outline:none;
    min-width:190px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .grade-select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
  .search-box{ flex:1; min-width:220px; position:relative; }
  .search-box input{
    width:100%; padding:11px 15px 11px 38px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; outline:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  [dir="rtl"] .search-box input{ font-family:'Cairo','Inter',sans-serif; padding:11px 38px 11px 15px; }
  .search-box input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
  .search-box::before{
    content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:15px; pointer-events:none;
  }
  [dir="rtl"] .search-box::before{ left:auto; right:13px; }
  .pay-filter{ display:flex; gap:6px; }
  .pay-filter button{
    padding:10px 14px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
    color:var(--muted); font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  [dir="rtl"] .pay-filter button{ font-family:'Cairo','Inter',sans-serif; }
  .pay-filter button:hover{ border-color:var(--gold); color:var(--ink); }
  .pay-filter button.active{ background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%); color:var(--on-accent); border-color:var(--gold); }

  .result-count{ font-size:12px; color:var(--muted); margin-bottom:12px; }

  .state-msg{
    display:none; align-items:center; justify-content:center; gap:10px;
    padding:64px 10px; color:var(--muted); font-size:13.5px; text-align:center;
  }
  .state-msg.show{ display:flex; }
  .state-msg.err{ color:var(--error); flex-direction:column; gap:9px; }
  .state-msg .spinner{
    width:18px; height:18px; border-radius:50%; border:2px solid rgba(139,31,31,0.18);
    border-top-color:var(--gold); animation:spin .7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; display:none; }
  .table-wrap.show{ display:block; }
  .table-scroll-controls{
    display:none;
    align-items:center;
    justify-content:flex-start;
    margin-bottom:8px;
  }
  .table-scroll-controls.show{ display:flex; }
  .table-scroll-arrows{ display:flex; gap:6px; }
  .table-scroll-btn{
    width:42px; height:42px; border:1px solid var(--line); border-radius:50%;
    background:var(--card); color:var(--gold-2); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-md); transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1.5px solid var(--gold-soft);
  }
  .table-scroll-btn:hover{
    background:var(--gold); color:var(--on-accent); border-color:var(--gold);
    transform: translateY(-2px); box-shadow: var(--shadow-lg);
  }
  .table-scroll-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .table-scroll-arrows{ display:flex; gap:12px; padding: 4px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:860px; }
  thead th{
    text-align:start; padding:12px 14px; background:var(--paper); color:var(--gold-2);
    font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  [dir="rtl"] thead th{ letter-spacing:0; }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .12s ease; }
  tbody tr:hover{ background:rgba(139,31,31,0.06); }
  .chip{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  .chip.paid{ background:var(--success-soft); color:var(--success); }
  .chip.unpaid{ background:var(--error-soft); color:var(--error); }
  .bar-track{ width:70px; height:6px; border-radius:4px; background:rgba(139,31,31,0.10); display:inline-block; vertical-align:middle; margin-inline-end:7px; }
  .bar-fill{ height:100%; border-radius:4px; background:var(--gold); }
  .phone-link{
    font-size:11px; color:var(--muted); text-decoration:none; display:inline-block;
    padding:3px 8px; border-radius:6px; background:rgba(139,31,31,0.06); transition:all .15s ease;
  }
  .phone-link:hover{ color:var(--gold-2); background:var(--gold-soft); }
  .grade-chip{
    font-size:9.5px; font-weight:700; color:var(--gold-2); background:rgba(139,31,31,0.12);
    padding:2px 7px; border-radius:999px;
  }
  .trend-btn{
    border:none; background:rgba(139,31,31,0.09); color:var(--gold-2); cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; padding:6px 11px; border-radius:8px;
    transition:all .15s ease;
  }
  .trend-btn:hover{ background:var(--gold-soft); }
  .pdf-btn{
    border:none; background:var(--gold-soft); color:var(--gold-2); cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:11px; padding:6px 11px; border-radius:8px;
    transition:all .15s ease; display:inline-flex; align-items:center; gap:5px;
  }
  [dir="rtl"] .pdf-btn{ font-family:'Cairo','Inter',sans-serif; }
  .pdf-btn:hover{ background:var(--gold); color:var(--on-accent); }
  .pdf-btn svg{ width:14px; height:14px; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:24px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .footer-note::before{ content:"🔒"; font-size:11px; }

  /* ===== Modal ===== */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,20,18,0.5); z-index:80;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--card); border-radius:16px; max-width:560px; width:100%; max-height:80vh;
    overflow:auto; padding:22px; box-shadow:var(--shadow-lg); border:1px solid var(--line);
  }
  .modal-close{ border:none; background:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
  .modal-close:hover{ color:var(--ink); }
  .section-title{
    display:flex; align-items:center; gap:9px;
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; color:var(--gold-2);
  }
  [dir="rtl"] .section-title{ font-family:'Cairo',serif; }
  .chart-box{ position:relative; height:260px; }
  .chart-empty{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--muted); font-size:12.5px; text-align:center; padding:0 20px;
  }
  .chart-empty.show{ display:flex; }
  .delta-badge{ font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:3px; }
  .delta-badge.up{ color:var(--success); }
  .delta-badge.down{ color:var(--error); }
  .delta-badge.flat{ color:var(--muted); }
  .grade-list-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 4px; border-bottom:1px solid var(--line); font-size:13px;
  }
  .grade-list-row:last-child{ border-bottom:none; }
  .grade-list-row .exam-name{ font-weight:600; color:var(--ink); }
  .grade-list-row .exam-score{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--ink); flex-shrink:0; display:flex; align-items:center; gap:8px; }
  .grade-list-row .exam-pct{ font-size:11px; color:var(--gold-2); background:var(--gold-soft); padding:2px 8px; border-radius:999px; font-weight:700; }
  .grades-avg-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 4px 2px; margin-top:6px; border-top:2px solid var(--line); font-size:13px;
  }
  .qr-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 0 4px; }
  .qr-wrap img{ width:220px; height:220px; object-fit:contain; border:1px solid var(--line); border-radius:12px; background:#fff; padding:10px; }

  /* ===== PDF Report Modal ===== */
  .pdf-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,20,18,0.55); z-index:90;
    align-items:center; justify-content:center; padding:20px;
  }
  .pdf-modal-overlay.show{ display:flex; }
  .pdf-modal-box{
    background:var(--card); border-radius:16px; max-width:700px; width:100%; max-height:85vh;
    overflow:auto; padding:28px; box-shadow:var(--shadow-lg); border:1px solid var(--line);
  }
  .pdf-preview-frame{
    width:100%; height:500px; border:1px solid var(--line); border-radius:12px;
    background:#fff; margin:16px 0;
  }
  .pdf-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .pdf-download-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 24px; border-radius:10px; border:none;
    background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
    color:var(--on-accent); font-family:'Inter',sans-serif; font-size:14px; font-weight:700;
    cursor:pointer; box-shadow:0 6px 16px rgba(139,31,31,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  [dir="rtl"] .pdf-download-btn{ font-family:'Cairo','Inter',sans-serif; }
  .pdf-download-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(139,31,31,0.35); }
  .pdf-download-btn svg{ width:18px; height:18px; }
  .pdf-close-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 24px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; font-weight:700;
    cursor:pointer; transition:all .15s ease;
  }
  [dir="rtl"] .pdf-close-btn{ font-family:'Cairo','Inter',sans-serif; }
  .pdf-close-btn:hover{ border-color:var(--gold); color:var(--gold-2); }

  @media (max-width:640px){
    .controls{ flex-direction:column; align-items:stretch; }
    .grade-select{ min-width:0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 19V9.5L12 4L20 9.5V19" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 19V13H15V19" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-eyebrow" id="brandEyebrow">بحث عن طالب</div>
      <h1 id="brandTitle">بحث الطلاب</h1>
      <p id="brandSubtitle">ابحث عن طالب بالاسم أو رقم الهاتف، لكل صف</p>
      <span class="company-badge" id="companyBadge">Milestones Group</span>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="updated-note" id="updatedNote"></span>
    <button class="icon-toggle-btn" id="langToggleBtn" onclick="toggleLang()" title="Switch language">EN</button>
    <button class="icon-toggle-btn" id="darkModeToggle" onclick="toggleDarkMode()" title="Dark mode">🌙</button>
    <a class="scanner-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/>
        <path d="M14 14h7v7h-7z" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span id="scannerBtnText">ماسح الحضور</span>
    </a>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="controls">
      <select class="grade-select" id="gradeSelect" onchange="onGradeChange()">
        <option value="all" id="optGradeAll">كل الصفوف</option>
        <option value="first" id="optGradeFirst">الصف الأول الثانوي</option>
        <option value="second" id="optGradeSecond">الصف الثاني الثانوي</option>
        <option value="third" id="optGradeThird">الصف الثالث الثانوي</option>
      </select>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو رقم الهاتف…" oninput="renderResults()">
      </div>
      <div class="pay-filter" id="payFilter">
        <button class="active" data-f="all" id="filterAllBtn" onclick="setPayFilter('all')">الكل</button>
        <button data-f="paid" id="filterPaidBtn" onclick="setPayFilter('paid')">مدفوع</button>
        <button data-f="unpaid" id="filterUnpaidBtn" onclick="setPayFilter('unpaid')">غير مدفوع</button>
      </div>
    </div>

    <div class="state-msg show" id="loadingMsg">
      <span class="spinner"></span> <span id="loadingMsgText">جاري تحميل البيانات من Supabase…</span>
    </div>
    <div class="state-msg err" id="errorMsg"></div>

    <div id="resultsWrap" style="display:none;">
      <div class="result-count" id="resultCount"></div>
      <div class="table-scroll-controls show">
        <div class="table-scroll-arrows">
          <button class="table-scroll-btn" onclick="scrollTable('right')" title="السابق">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="table-scroll-btn" onclick="scrollTable('left')" title="التالي">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="table-wrap show" id="studentTableWrap">
        <table>
          <thead>
            <tr>
              <th id="thName">الاسم</th>
              <th id="thGrade">الصف</th>
              <th id="thPresent">حضور</th>
              <th id="thAbsent">غياب</th>
              <th id="thRate">نسبة الحضور</th>
              <th id="thStudentPhone">هاتف الطالب</th>
              <th id="thParentPhone">هاتف ولي الأمر</th>
              <th id="thPayment">الدفع</th>
              <th id="thLast">آخر حضور</th>
              <th id="thExams">الامتحانات</th>
              <th id="thReport">التقرير</th>
              <th id="thQr">عرض QR</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>

  /* ============================================================

  // Remove Arabic diacritics (tashkeel)
  function removeDiacritics(str) {
    if (!str) return "";
    return str.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  }

  // Normalize Arabic text: remove diacritics, normalize alif/yaa/taa marbuta
  function normalizeArabic(str) {
    if (!str) return "";
    let s = removeDiacritics(str);
    s = s.replace(/[\u0623\u0625\u0622\u0627\u0649]/g, "\u0627"); // ا أ إ آ ى -> ا
    s = s.replace(/[\u064A\u0649]/g, "\u064A"); // ي ى -> ي
    s = s.replace(/[\u0629]/g, "\u0647"); // ة -> ه
    s = s.replace(/\s+/g, " ").trim();
    return s.toLowerCase();
  }

  // Normalize English text: lowercase, remove extra spaces
  function normalizeEnglish(str) {
    if (!str) return "";
    return str.replace(/\s+/g, " ").trim().toLowerCase();
  }

  // Build search tokens from query
  function getSearchTokens(query) {
    if (!query) return [];
    return normalizeEnglish(query).split(/\s+/).filter(t => t.length > 0);
  }

  // Fuzzy score: how well does 'text' contain the 'token'
  function fuzzyContains(normalizedText, token) {
    if (!token) return 0;
    if (normalizedText.includes(token)) return 1;

    // Try token as subsequence (not necessarily contiguous)
    let ti = 0;
    for (let i = 0; i < normalizedText.length && ti < token.length; i++) {
      if (normalizedText[i] === token[ti]) ti++;
    }
    if (ti === token.length) return 0.7; // subsequence match

    // Levenshtein-based: try sliding window
    const tokenLen = token.length;
    if (tokenLen <= normalizedText.length + 1) {
      let best = 0;
      for (let i = 0; i <= normalizedText.length - tokenLen + 1; i++) {
        const window = normalizedText.substring(i, i + tokenLen);
        const dist = levenshteinDistance(token, window);
        const ratio = 1 - dist / tokenLen;
        if (ratio > best) best = ratio;
      }
      // Also try window + 1
      if (tokenLen + 1 <= normalizedText.length) {
        for (let i = 0; i <= normalizedText.length - tokenLen - 1; i++) {
          const window = normalizedText.substring(i, i + tokenLen + 1);
          const dist = levenshteinDistance(token, window);
          const ratio = 1 - dist / tokenLen;
          if (ratio > best) best = ratio;
        }
      }
      return best;
    }

    // Token longer than text: check if text is a subsequence
    let ti2 = 0;
    for (let i = 0; i < normalizedText.length && ti2 < token.length; i++) {
      if (normalizedText[i] === token[ti2]) ti2++;
    }
    return ti2 > 0 ? 0.4 : 0;
  }

  // Simple Levenshtein distance
  function levenshteinDistance(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }

  // Score a student against the query tokens
  function scoreStudent(student, tokens) {
    if (!tokens.length) return 0;

    const normName = normalizeArabic(student.name);
    const normStudentPhone = normalizeEnglish(student.studentPhone);
    const normParentPhone = normalizeEnglish(student.parentPhone);
    const normQrCode = normalizeEnglish(student.qrCode);

    // Also create an English transliteration of the name
    const nameTokens = normName.split(/\s+/).filter(t => t.length > 0);

    let maxScore = 0;

    for (const token of tokens) {
      let bestTokenScore = 0;

      // Check name
      for (const nameToken of nameTokens) {
        const s = fuzzyContains(nameToken, token);
        if (s > bestTokenScore) bestTokenScore = s;
      }
      // Check full name as one
      const fullScore = fuzzyContains(normName, token);
      if (fullScore > bestTokenScore) bestTokenScore = fullScore;

      // Check phone numbers
      const phoneScore = Math.max(
        fuzzyContains(normStudentPhone, token),
        fuzzyContains(normParentPhone, token)
      );
      if (phoneScore > bestTokenScore) bestTokenScore = phoneScore;

      // Check QR code
      const qrScore = fuzzyContains(normQrCode, token);
      if (qrScore > bestTokenScore) bestTokenScore = qrScore;

      if (bestTokenScore > maxScore) maxScore = bestTokenScore;
    }

    return maxScore;
  }

  function renderResults(){

    if(tokens.length > 0){
      // Score each student
      const scored = rows.map(s => ({ student: s, score: scoreStudent(s, tokens) }));
      // Filter: only include students with score >= 0.5 (good match threshold)
      const matched = scored.filter(({ score }) => score >= 0.5);
      // Sort by score descending
      matched.sort((a, b) => b.score - a.score);
      rows = matched.map(({ student }) => student);
    }

    document.getElementById("resultCount").textContent = tr.resultCount(rows.length);

    const body = document.getElementById("resultsBody");
    if(!rows.length){
      body.innerHTML = `<tr><td colspan="12" style="text-align:center; color:var(--muted); padding:24px;">${tr.noResults}</td></tr>`;
      return;
    }

    body.innerHTML = rows.map(s => {
      const p = pct(s.attendanceCount, s.absenceCount);
      const paid = isPaid(s.paymentStatus);
      const hasPaymentRecord = s.paymentStatus !== "";
      const safeName = (s.name || "").replace(/'/g, "\\'");
      const safeQrUrl = (s.qrUrl || "").replace(/'/g, "\\'");
      return `
        <tr>
          <td style="font-weight:600;">${s.name || tr.dash}</td>
          <td><span class="grade-chip">${gradeLabel(s.grade)}</span></td>
          <td>${s.attendanceCount}</td>
          <td>${s.absenceCount}</td>
          <td>
            ${p != null ? `<span class="bar-track"><span class="bar-fill" style="width:${p}%;"></span></span>${p}%` : tr.dash}
          </td>
          <td>${s.studentPhone ? `<a class="phone-link" href="tel:${s.studentPhone}">${s.studentPhone}</a>` : tr.dash}</td>
          <td>${s.parentPhone ? `<a class="phone-link" href="tel:${s.parentPhone}">${s.parentPhone}</a>` : tr.dash}</td>
          <td>${hasPaymentRecord ? `<span class="chip ${paid ? 'paid' : 'unpaid'}">${paid ? tr.paid : tr.unpaid}</span>` : tr.dash}</td>
          <td>${s.lastAttendance || tr.dash}</td>
          <td style="display:flex; gap:6px;">
            <button class="trend-btn" onclick="showStudentTrend('${s.qrCode}','${s.grade}','${safeName}')" title="${tr.thExams}">📈</button>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

  function chartThemeColors(){
    const dark = document.body.classList.contains("dark");
    return {

      fill: dark ? "rgba(192,57,43,0.20)" : "rgba(139,31,31,0.15)",
      point: dark ? "rgba(192,57,43,1)" : "rgba(139,31,31,1)",

  async function showStudentTrend(qrCode, grade, name){
    const tr = t();
    const overlay = document.getElementById("studentTrendModalOverlay");
    const loadingEl = document.getElementById("trendLoadingMsg");
    const chartWrap = document.getElementById("trendChartWrap");
    const canvas = document.getElementById("studentTrendChart");
    const emptyEl = document.getElementById("studentTrendEmpty");
    const summaryEl = document.getElementById("studentTrendSummary");

    document.getElementById("studentTrendTitle").textContent = `${name || tr.student}${tr.trendTitleSuffix}`;
    document.getElementById("trendLoadingMsgText").textContent = tr.loadingExams;
    loadingEl.classList.add("show");
    chartWrap.style.display = "none";
    emptyEl.classList.remove("show");
    summaryEl.textContent = "";
    if(studentTrendChartInstance){ studentTrendChartInstance.destroy(); studentTrendChartInstance = null; }
    overlay.classList.add("show");

    try{
      const ecol = EXAMS_SCHEMA.col;
      const scol = SCORES_SCHEMA.col;

      const { data: exams, error: examsErr } = await supa
        .from(EXAMS_SCHEMA.table).select("*")
        .eq(ecol.grade, grade)
        .order(ecol.createdAt, { ascending: true });
      if(examsErr) throw examsErr;

      let scores = [];
      if(exams && exams.length){
        const ids = exams.map(e => e[ecol.id]);
        const { data: scoreRows, error: scoresErr } = await supa
          .from(SCORES_SCHEMA.table).select("*")
          .in(scol.examId, ids)
          .eq(scol.studentCode, qrCode);
        if(scoresErr) throw scoresErr;
        scores = scoreRows || [];
      }

      const points = (exams || []).map(e => {
        const row = scores.find(sc => sc[scol.examId] === e[ecol.id]);
        if(!row) return null;
        const sc = Number(row[scol.score]);
        const mx = Number(e[ecol.maxScore]) || 100;
        if(isNaN(sc)) return null;
        return { examName: e[ecol.name], pct: Math.round((sc / mx) * 100), raw: row[scol.score], max: e[ecol.maxScore] };
      }).filter(p => p != null);

      loadingEl.classList.remove("show");
      chartWrap.style.display = "block";

      if(points.length < 2){
        canvas.style.display = "none";
        emptyEl.textContent = points.length === 1 ? tr.onlyOneExam : tr.noExamsYet;
        emptyEl.classList.add("show");
        return;
      }

      canvas.style.display = "block";
      emptyEl.classList.remove("show");

      const colors = chartThemeColors();
      studentTrendChartInstance = new Chart(canvas, {
        type: "line",
        data: {
          labels: points.map(p => p.examName),
          datasets: [{
            label: "Score",
            data: points.map(p => p.pct),
            borderColor: colors.line,
            backgroundColor: colors.fill,
            fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: colors.point
          }]
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => {
              const p = points[c.dataIndex];
              return `${p.raw} / ${p.max} (${p.pct}%)`;
            } } }
          },
          scales: {
            y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%", font: { size: 10 }, color: colors.tick }, grid: { color: colors.grid } },
            x: { ticks: { font: { size: 10 }, color: colors.tick }, grid: { display: false } }
          }
        }
      });

      const first = points[0].pct, last = points[points.length - 1].pct;
      const diff = last - first;
      const fromToStr = tr.fromTo(points[0].examName, points[points.length - 1].examName);
      if(diff > 0) summaryEl.innerHTML = `<span class="delta-badge up">${tr.improvedBy(diff)}</span> ${fromToStr}`;
      else if(diff < 0) summaryEl.innerHTML = `<span class="delta-badge down">${tr.droppedBy(Math.abs(diff))}</span> ${fromToStr}`;
      else summaryEl.innerHTML = `<span class="delta-badge flat">${tr.noChange}</span> ${fromToStr}`;

    }catch(err){
      console.error(err);
      loadingEl.classList.remove("show");
      chartWrap.style.display = "block";
      canvas.style.display = "none";
      emptyEl.textContent = tr.couldntLoadExams + (err.message || err);
      emptyEl.classList.add("show");
    }
  }

  }

  async function showPdfReport(qrCode, grade, name){
    const tr = t();
    const overlay = document.getElementById("pdfReportModalOverlay");
    const loadingEl = document.getElementById("pdfLoadingMsg");
    const frame = document.getElementById("pdfPreviewFrame");
    const actions = document.getElementById("pdfActions");

    document.getElementById("pdfReportTitle").textContent = `${name || tr.student}${tr.reportTitleSuffix}`;
    loadingEl.classList.add("show");
    frame.style.display = "none";
    actions.style.display = "none";
    overlay.classList.add("show");

    try{
      const ecol = EXAMS_SCHEMA.col;
      const scol = SCORES_SCHEMA.col;

      // Fetch exam scores
      let examRows = [];
      const { data: exams, error: examsErr } = await supa
        .from(EXAMS_SCHEMA.table).select("*")
        .eq(ecol.grade, grade)
        .order(ecol.createdAt, { ascending: true });
      if(!examsErr && exams && exams.length){
        const ids = exams.map(e => e[ecol.id]);
        const { data: scoreRows, error: scoresErr } = await supa
          .from(SCORES_SCHEMA.table).select("*")
          .in(scol.examId, ids)
          .eq(scol.studentCode, qrCode);
        if(!scoresErr && scoreRows){
          examRows = exams.map(e => {
            const row = scoreRows.find(sc => sc[scol.examId] === e[ecol.id]);
            const mx = Number(e[ecol.maxScore]) || 100;
            if(!row) return { examName: e[ecol.name], max: e[ecol.maxScore], raw: null, pct: null };
            const sc = Number(row[scol.score]);
            return { examName: e[ecol.name], max: e[ecol.maxScore], raw: row[scol.score], pct: isNaN(sc) ? null : Math.round((sc / mx) * 100) };
          });
        }
      }

      // Find student data
      const student = students.find(s => s.qrCode === qrCode && s.grade === grade);
      if(!student) throw new Error("Student not found");

      const p = pct(student.attendanceCount, student.absenceCount);
      const paid = isPaid(student.paymentStatus);
      const avg = examRows.filter(r => r.pct != null);
      const avgScore = avg.length ? Math.round(avg.reduce((a,b) => a + b.pct, 0) / avg.length) : null;

      // Generate PDF HTML
      const isAr = currentLang === "ar";
      const htmlContent = buildPdfHtml(tr, isAr, name, student, p, paid, paid ? tr.pdfPaid : tr.pdfUnpaid, examRows, avgScore);

      // Render HTML to a hidden container, then capture with html2canvas
      const container = document.createElement("div");
      container.style.cssText = "position:fixed; left:-9999px; top:0; width:595px; background:#fff;";
      container.innerHTML = htmlContent;
      document.body.appendChild(container);

      // Wait for fonts to load
      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 500));

      const canvas = await window.html2canvas(container, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false
      });

      // Remove hidden container
      document.body.removeChild(container);

      // Create PDF with jsPDF and embed the canvas image
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const imgWidth = pageWidth - 40;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const imgData = canvas.toDataURL("image/png");

      // Add first page
      doc.addImage(imgData, "PNG", 20, 20, imgWidth, imgHeight);

      // Handle overflow pages if content is taller than one page
      if (imgHeight > pageHeight - 40) {
        let heightLeft = imgHeight;
        let position = 0;
        while (heightLeft > 0) {
          position = -(pageHeight - 40) * Math.floor((imgHeight - heightLeft) / (pageHeight - 40));
          if (heightLeft < pageHeight - 40) break;
          doc.addPage();
          doc.addImage(imgData, "PNG", 20, position + 20, imgWidth, imgHeight);
          heightLeft -= (pageHeight - 40);
        }
      }

      const pdfBlob = doc.output('blob');
      const pdfUrl = URL.createObjectURL(pdfBlob);
      frame.src = pdfUrl;
      frame.style.display = "block";
      currentPdfBlob = pdfBlob;
      currentPdfFilename = `report_${name || qrCode}_${new Date().toISOString().split('T')[0]}.pdf`;
      actions.style.display = "flex";
      loadingEl.classList.remove("show");

    }catch(err){
      console.error(err);
      loadingEl.classList.remove("show");
      frame.style.display = "block";
      frame.srcdoc = `<div style="color:red; text-align:center; padding:40px; font-family:sans-serif;">Error generating PDF: ${err.message || err}</div>`;
      actions.style.display = "flex";
    }
  }

        <!-- Exam Scores -->
        ${examRows.length > 0 ? `

          ${tr.thExams}

          <thead>
            <tr style="background:#8b1f1f; color:#f6f2ea;">

    applyStaticTranslations();
  })();

  loadData();
</script>
