<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Search</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#262624; --ink-2:#3a3835;
    --paper:#f2efe8; --card:#faf8f3;
    --line:rgba(38,38,36,0.16);
    --gold:#8b1f1f; --gold-2:#6f1818; --gold-soft:rgba(139,31,31,0.13);
    --success:#2e7d52; --success-soft:rgba(46,125,82,0.12);
    --error:#8b1f1f; --error-soft:rgba(139,31,31,0.11);
    --muted:#6d6c68;
    --cream-bg-1:#f2efe8; --cream-bg-2:#f7f4ee;
    --on-accent:#f6f2ea;
    --shadow-sm:0 1px 2px rgba(40,40,38,0.10);
    --shadow-md:0 8px 24px rgba(40,40,38,0.14);
    --shadow-lg:0 20px 50px rgba(40,40,38,0.18);
  }
  body.dark{
    --ink:#eeece7; --ink-2:#e2dfd8;
    --paper:#1a1a1a; --card:#232323;
    --line:rgba(238,236,231,0.14);
    --gold:#c0392b; --gold-2:#9c2f24; --gold-soft:rgba(192,57,43,0.20);
    --success:#3fa873; --success-soft:rgba(63,168,115,0.18);
    --error:#c0392b; --error-soft:rgba(192,57,43,0.18);
    --muted:#a3a09a;
    --cream-bg-1:#1a1a1a; --cream-bg-2:#212121;
    --on-accent:#f6f2ea;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg:0 20px 50px rgba(0,0,0,0.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(139,31,31,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(139,31,31,0.06), transparent 45%),
      linear-gradient(160deg, var(--cream-bg-1), var(--cream-bg-2));
    color:var(--ink);
    min-height:100vh;
    padding:32px 24px 64px;
    transition:background .2s ease, color .2s ease;
  }
  [dir="rtl"] body{ font-family:'Cairo','Inter',sans-serif; }
  .num{ font-family:'Space Grotesk',sans-serif; }

  .topbar{
    max-width:1100px; margin:0 auto 26px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background:var(--gold); opacity:0.92;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(139,31,31,0.35);
  }
  .brand-mark svg{ width:22px; height:22px; }
  .brand-mark svg path{ stroke:var(--on-accent) !important; }
  .brand-eyebrow{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:2px; }
  [dir="rtl"] .brand-eyebrow{ letter-spacing:0; }
  .brand h1{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:var(--gold-2); letter-spacing:-0.01em; }
  [dir="rtl"] .brand h1{ font-family:'Cairo',serif; letter-spacing:0; }
  .brand p{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .company-badge{
    font-size:10px; font-weight:700; color:var(--gold); background:var(--gold-soft);
    padding:3px 10px; border-radius:999px; letter-spacing:0.05em;
    border:1px solid rgba(139,31,31,0.2);
  }
  .topbar-actions{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .updated-note{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .updated-note::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px var(--success-soft); }
  .scanner-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:10px;
    background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
    color:var(--on-accent); font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    text-decoration:none; box-shadow:0 6px 16px rgba(139,31,31,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .scanner-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(139,31,31,0.35); }
  .scanner-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .icon-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:42px; height:42px; padding:0 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; font-weight:700; cursor:pointer;
    transition:all .15s ease;
  }
  .icon-toggle-btn:hover{ border-color:var(--gold); color:var(--gold-2); }

  .wrap{ max-width:1100px; margin:0 auto; }
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px; box-shadow:var(--shadow-lg);
    transition:background .2s ease, border-color .2s ease;
  }

  .controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .grade-select{
    padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; outline:none;
    min-width:190px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .grade-select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
  .search-box{ flex:1; min-width:220px; position:relative; }
  .search-box input{
    width:100%; padding:11px 15px 11px 38px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; outline:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  [dir="rtl"] .search-box input{ font-family:'Cairo','Inter',sans-serif; padding:11px 38px 11px 15px; }
  .search-box input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
  .search-box::before{
    content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:15px; pointer-events:none;
  }
  [dir="rtl"] .search-box::before{ left:auto; right:13px; }
  .pay-filter{ display:flex; gap:6px; }
  .pay-filter button{
    padding:10px 14px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
    color:var(--muted); font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  [dir="rtl"] .pay-filter button{ font-family:'Cairo','Inter',sans-serif; }
  .pay-filter button:hover{ border-color:var(--gold); color:var(--ink); }
  .pay-filter button.active{ background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%); color:var(--on-accent); border-color:var(--gold); }

  .result-count{ font-size:12px; color:var(--muted); margin-bottom:12px; }

  .state-msg{
    display:none; align-items:center; justify-content:center; gap:10px;
    padding:64px 10px; color:var(--muted); font-size:13.5px; text-align:center;
  }
  .state-msg.show{ display:flex; }
  .state-msg.err{ color:var(--error); flex-direction:column; gap:9px; }
  .state-msg .spinner{
    width:18px; height:18px; border-radius:50%; border:2px solid rgba(139,31,31,0.18);
    border-top-color:var(--gold); animation:spin .7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; display:none; }
  .table-wrap.show{ display:block; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:860px; }
  thead th{
    text-align:start; padding:12px 14px; background:var(--paper); color:var(--gold-2);
    font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  [dir="rtl"] thead th{ letter-spacing:0; }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .12s ease; }
  tbody tr:hover{ background:rgba(139,31,31,0.06); }
  .chip{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  .chip.paid{ background:var(--success-soft); color:var(--success); }
  .chip.unpaid{ background:var(--error-soft); color:var(--error); }
  .pdf-btn{
    border:none; background:var(--gold-soft); color:var(--gold-2); cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:11px; padding:6px 11px; border-radius:8px;
    transition:all .15s ease; display:inline-flex; align-items:center; gap:5px;
  }
  [dir="rtl"] .pdf-btn{ font-family:'Cairo','Inter',sans-serif; }
  .pdf-btn:hover{ background:var(--gold); color:var(--on-accent); }
  .pdf-btn svg{ width:14px; height:14px; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:24px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .footer-note::before{ content:"🔒"; font-size:11px; }

  /* ===== Modal ===== */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,20,18,0.5); z-index:80;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--card); border-radius:16px; max-width:560px; width:100%; max-height:80vh;
    overflow:auto; padding:22px; box-shadow:var(--shadow-lg); border:1px solid var(--line);
  }
  .modal-close{ border:none; background:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
  .modal-close:hover{ color:var(--ink); }
  .section-title{
    display:flex; align-items:center; gap:9px;
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; color:var(--gold-2);
  }
  [dir="rtl"] .section-title{ font-family:'Cairo',serif; }

  /* ===== PDF Report Modal ===== */
  .pdf-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,20,18,0.55); z-index:90;
    align-items:center; justify-content:center; padding:20px;
  }
  .pdf-modal-overlay.show{ display:flex; }
  .pdf-modal-box{
    background:var(--card); border-radius:16px; max-width:700px; width:100%; max-height:85vh;
    overflow:auto; padding:28px; box-shadow:var(--shadow-lg); border:1px solid var(--line);
  }
  .pdf-preview-frame{
    width:100%; height:500px; border:1px solid var(--line); border-radius:12px;
    background:#fff; margin:16px 0;
  }
  .pdf-actions{
    display:flex; gap:12px; justify-content:flex-end;
  }
  .pdf-download-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:10px;
    background:linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
    color:var(--on-accent); font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 16px rgba(139,31,31,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .pdf-download-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(139,31,31,0.35); }
  .pdf-download-btn svg{ width:16px; height:16px; }
  .pdf-close-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:11px 18px; border-radius:10px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    transition:all .15s ease;
  }
  [dir="rtl"] .pdf-close-btn{ font-family:'Cairo','Inter',sans-serif; }
  .pdf-close-btn:hover{ border-color:var(--gold); color:var(--gold-2); }

  @media (max-width:640px){
    .controls{ flex-direction:column; align-items:stretch; }
    .grade-select{ min-width:0; }
  }
</style>
</head>

      paid: "مدفوع", unpaid: "غير مدفوع",
      footer: "يتم قراءة البيانات مباشرة من Supabase باستخدام مفتاح للقراءة فقط",
      reportTitleSuffix: " — تقرير الطالب",
      pdfLoading: "جاري توليد تقرير PDF…",
      pdfDownload: "تحميل PDF",
      pdfClose: "إغلاق",
      pdfReportHeading: "تقرير الطالب",
      pdfGrade: "الصف", pdfPresent: "حضور", pdfAbsent: "غياب",
      pdfRate: "نسبة الحضور", pdfPaid: "مدفوع", pdfUnpaid: "غير مدفوع",
      pdfPayment: "حالة الدفع", pdfStudentPhone: "هاتف الطالب",
      pdfParentPhone: "هاتف ولي الأمر", pdfLastAttendance: "آخر حضور",
      pdfAttendance: "الحضور والمعلومات",
      pdfExam: "الامتحان", pdfScore: "الدرجة", pdfPct: "النسبة المئوية",
      pdfAvg: "المتوسط", pdfFooter: "تقرير سري",
      thExams: "الامتحانات",
      noExamsYet: "لم يتم تسجيل درجات امتحانات بعد"
    }
  };

  let currentLang = "ar";
  let currentPayFilter = "all";
  let currentGrade = "all";
  let students = [];
  let currentPdfBlob = null;
  let currentPdfFilename = "";

  function t() { return translations[currentLang]; }

  function toggleLang(){
    currentLang = currentLang === "ar" ? "en" : "ar";
    localStorage.setItem("studentSearchLang", currentLang);
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
    document.getElementById("langToggleBtn").textContent = currentLang === "ar" ? "EN" : "AR";
    applyStaticTranslations();
    renderResults();
  }

  function toggleDarkMode(){
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("studentSearchDarkMode", isDark ? "1" : "0");
    document.getElementById("darkModeToggle").textContent = isDark ? "☀️" : "🌙";
  }

  function applyStaticTranslations(){
    const tr = t();
    document.getElementById("brandEyebrow").textContent = tr.eyebrow;
    document.getElementById("brandTitle").textContent = tr.title;
    document.getElementById("brandSubtitle").textContent = tr.subtitle;
    document.getElementById("optGradeAll").textContent = tr.gradeAll;
    document.getElementById("optGradeFirst").textContent = tr.gradeFirst;
    document.getElementById("optGradeSecond").textContent = tr.gradeSecond;
    document.getElementById("optGradeThird").textContent = tr.gradeThird;
    document.getElementById("searchInput").placeholder = tr.searchPlaceholder;
    document.getElementById("filterAllBtn").textContent = tr.filterAll;
    document.getElementById("filterPaidBtn").textContent = tr.filterPaid;
    document.getElementById("filterUnpaidBtn").textContent = tr.filterUnpaid;
    document.getElementById("loadingMsgText").textContent = tr.loadingData;
    document.getElementById("footerNoteText").textContent = tr.footer;
    document.getElementById("thName").textContent = tr.thName;
    document.getElementById("thGrade").textContent = tr.thGrade;
    document.getElementById("thPresent").textContent = tr.thPresent;
    document.getElementById("thAbsent").textContent = tr.thAbsent;
    document.getElementById("thRate").textContent = tr.thRate;
    document.getElementById("thPayment").textContent = tr.thPayment;
    document.getElementById("thReport").textContent = tr.thReport;
    document.getElementById("pdfDownloadBtnText").textContent = tr.pdfDownload;
    document.getElementById("pdfCloseBtnText").textContent = tr.pdfClose;
  }

  function gradeLabel(g){
    const tr = t();
    return { first: tr.gradeFirst, second: tr.gradeSecond, third: tr.gradeThird }[g] || g;
  }

  function isPaid(status){
    return status && status.toLowerCase() === "paid";
  }

  function pct(present, absent){
    const total = present + absent;
    return total > 0 ? Math.round((present / total) * 100) : 0;
  }

  async function loadData(){
    const tr = t();
    try{
      const grades = currentGrade === "all" ? GRADES : [currentGrade];
      students = [];
      
      for(const grade of grades){
        const { data, error } = await supa
          .from(SCHEMA.attendanceTable(grade))
          .select("*");
        if(error) throw error;
        if(data) students.push(...data.map(s => ({ ...s, grade })));
      }
      
      document.getElementById("loadingMsg").classList.remove("show");
      document.getElementById("resultsWrap").style.display = "block";
      renderResults();
    }catch(err){
      console.error(err);
      document.getElementById("loadingMsg").classList.remove("show");
      document.getElementById("errorMsg").classList.add("show");
      document.getElementById("errorMsg").textContent = tr.couldntLoad || "Error loading data";
    }
  }

  function onGradeChange(){
    currentGrade = document.getElementById("gradeSelect").value;
    document.getElementById("loadingMsg").classList.add("show");
    document.getElementById("resultsWrap").style.display = "none";
    loadData();
  }

  function setPayFilter(f){
    currentPayFilter = f;
    document.querySelectorAll(".pay-filter button").forEach(b => b.classList.remove("active"));
    document.querySelector(`[data-f="${f}"]`).classList.add("active");
    renderResults();
  }

  function renderResults(){
    const tr = t();
    const query = document.getElementById("searchInput").value.toLowerCase();
    
    let filtered = students.filter(s => {
      const matchesQuery = !query || 
        s[SCHEMA.col.fullName].toLowerCase().includes(query) ||
        (s[SCHEMA.col.studentPhone] && s[SCHEMA.col.studentPhone].includes(query));
      
      const matchesPayment = currentPayFilter === "all" || 
        (currentPayFilter === "paid" ? isPaid(s[SCHEMA.col.paymentStatus]) : !isPaid(s[SCHEMA.col.paymentStatus]));
      
      return matchesQuery && matchesPayment;
    });

    document.getElementById("resultCount").textContent = tr.resultCount(filtered.length);

    const tbody = document.getElementById("resultsBody");
    tbody.innerHTML = filtered.length === 0 
      ? `<tr><td colspan="7" style="text-align:center; padding:20px; color:var(--muted);">${tr.noResults}</td></tr>`
      : filtered.map(s => {
          const attendancePct = pct(s[SCHEMA.col.attendanceCount], s[SCHEMA.col.absenceCount]);
          const paid = isPaid(s[SCHEMA.col.paymentStatus]);
          return `
            <tr>
              <td>${s[SCHEMA.col.fullName]}</td>
              <td>${gradeLabel(s.grade)}</td>
              <td>${s[SCHEMA.col.attendanceCount]}</td>
              <td>${s[SCHEMA.col.absenceCount]}</td>
              <td>${attendancePct}%</td>
              <td><span class="chip ${paid ? 'paid' : 'unpaid'}">${paid ? tr.paid : tr.unpaid}</span></td>
              <td><button class="pdf-btn" onclick="showPdfReport('${s[SCHEMA.col.qrCode]}', '${s.grade}', '${s[SCHEMA.col.fullName].replace(/'/g, "\\'")}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                ${tr.pdfDownload}
              </button></td>
            </tr>
          `;
        }).join("");
  }

  async function showPdfReport(qrCode, grade, name){
    const tr = t();
    const overlay = document.getElementById("pdfReportModalOverlay");
    const loadingEl = document.getElementById("pdfLoadingMsg");
    const frame = document.getElementById("pdfPreviewFrame");
    const actions = document.getElementById("pdfActions");

    document.getElementById("pdfReportTitle").textContent = `${name}${tr.reportTitleSuffix}`;
    document.getElementById("pdfLoadingMsgText").textContent = tr.pdfLoading;
    loadingEl.classList.add("show");
    frame.style.display = "none";
    actions.style.display = "none";
    overlay.classList.add("show");

    try{
      const ecol = EXAMS_SCHEMA.col;
      const scol = SCORES_SCHEMA.col;

      let examRows = [];
      const { data: exams, error: examsErr } = await supa
        .from(EXAMS_SCHEMA.table).select("*")
        .eq(ecol.grade, grade)
        .order(ecol.createdAt, { ascending: true });
      
      if(!examsErr && exams && exams.length){
        const ids = exams.map(e => e[ecol.id]);
        const { data: scoreRows, error: scoresErr } = await supa
          .from(SCORES_SCHEMA.table).select("*")
          .in(scol.examId, ids)
          .eq(scol.studentCode, qrCode);
        
        if(!scoresErr && scoreRows){
          examRows = exams.map(e => {
            const row = scoreRows.find(sc => sc[scol.examId] === e[ecol.id]);
            const mx = Number(e[ecol.maxScore]) || 100;
            if(!row) return { examName: e[ecol.name], max: e[ecol.maxScore], raw: null, pct: null };
            const sc = Number(row[scol.score]);
            return { examName: e[ecol.name], max: e[ecol.maxScore], raw: row[scol.score], pct: isNaN(sc) ? null : Math.round((sc / mx) * 100) };
          });
        }
      }

      const student = students.find(s => s[SCHEMA.col.qrCode] === qrCode && s.grade === grade);
      if(!student) throw new Error("Student not found");

      const p = pct(student[SCHEMA.col.attendanceCount], student[SCHEMA.col.absenceCount]);
      const paid = isPaid(student[SCHEMA.col.paymentStatus]);
      const avg = examRows.filter(r => r.pct != null);
      const avgScore = avg.length ? Math.round(avg.reduce((a,b) => a + b.pct, 0) / avg.length) : null;

      const isAr = currentLang === "ar";
      const htmlContent = buildPdfHtml(tr, isAr, name, student, p, paid, paid ? tr.pdfPaid : tr.pdfUnpaid, examRows, avgScore);

      const container = document.createElement("div");
      container.style.cssText = "position:fixed; left:-9999px; top:0; width:595px; background:#fff; padding:0;";
      container.innerHTML = htmlContent;
      document.body.appendChild(container);

      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 800));

      const canvas = await window.html2canvas(container, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        width: 595,
        height: container.offsetHeight
      });

      document.body.removeChild(container);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait', compress: true });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const imgWidth = pageWidth - 40;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const imgData = canvas.toDataURL("image/png");

      doc.addImage(imgData, "PNG", 20, 20, imgWidth, imgHeight);

      if (imgHeight > pageHeight - 40) {
        let heightLeft = imgHeight;
        let position = 0;
        while (heightLeft > 0) {
          position = -(pageHeight - 40) * Math.floor((imgHeight - heightLeft) / (pageHeight - 40));
          if (heightLeft < pageHeight - 40) break;
          doc.addPage();
          doc.addImage(imgData, "PNG", 20, position + 20, imgWidth, imgHeight);
          heightLeft -= (pageHeight - 40);
        }
      }

      const pdfBlob = doc.output('blob');
      const pdfUrl = URL.createObjectURL(pdfBlob);
      frame.src = pdfUrl;
      frame.style.display = "block";
      currentPdfBlob = pdfBlob;
      currentPdfFilename = `report_${name}_${new Date().toISOString().split('T')[0]}.pdf`;
      actions.style.display = "flex";
      loadingEl.classList.remove("show");

    }catch(err){
      console.error(err);
      loadingEl.classList.remove("show");
      frame.style.display = "block";
      frame.srcdoc = `<div style="color:red; text-align:center; padding:40px; font-family:sans-serif;">Error generating PDF: ${err.message || err}</div>`;
      actions.style.display = "flex";
    }
  }

  function buildPdfHtml(tr, isAr, name, student, attendancePct, paid, paymentLabel, examRows, avgScore){
    const dir = isAr ? "rtl" : "ltr";
    const font = "'Noto Sans Arabic','Noto Sans','Arial','sans-serif'";

    let examTableRows = examRows.map(r => `
      <tr>
        <td style="padding:10px 12px; border:1px solid #e0e0e0; text-align:center;">${r.examName}</td>
        <td style="padding:10px 12px; border:1px solid #e0e0e0; text-align:center;">${r.raw != null ? r.raw + " / " + r.max : tr.notEntered || "—"}</td>
        <td style="padding:10px 12px; border:1px solid #e0e0e0; text-align:center; font-weight:700; color:#8b1f1f;">${r.pct != null ? r.pct + "%" : "—"}</td>
      </tr>
    `).join("");

    return `
      <!DOCTYPE html>
      <html dir="${dir}" lang="${isAr ? 'ar' : 'en'}">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: ${font}; font-size: 11pt; color: #262624; line-height: 1.6; background: #f2efe8; padding: 0; }
          .report-container { width: 595px; margin: 0 auto; background: #fff; padding: 40px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
          .report-header { text-align: center; border-bottom: 3px solid #8b1f1f; padding-bottom: 20px; margin-bottom: 30px; }
          .report-title { font-size: 24pt; font-weight: 700; color: #8b1f1f; margin-bottom: 10px; letter-spacing: 1px; }
          .student-name { font-size: 18pt; font-weight: 700; color: #262624; margin: 10px 0; }
          .student-grade { font-size: 11pt; color: #6d6c68; margin-top: 5px; }
          .section-title { font-size: 13pt; font-weight: 700; color: #8b1f1f; margin: 25px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #8b1f1f; }
          .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 1px solid #d0d0d0; background: #fff; }
          .info-table tr { border-bottom: 1px solid #d0d0d0; }
          .info-table tr:last-child { border-bottom: none; }
          .info-table tr:nth-child(odd) { background: #faf8f3; }
          .info-table tr:nth-child(even) { background: #fff; }
          .info-table td { padding: 12px 14px; border-right: 1px solid #d0d0d0; }
          .info-table td:last-child { border-right: none; }
          .info-table td:first-child { font-weight: 700; color: #6f1818; width: 35%; background: #f7f4ee; }
          .info-table td:nth-child(3) { font-weight: 700; color: #6f1818; width: 35%; background: #f7f4ee; }
          .exams-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 1px solid #d0d0d0; }
          .exams-table thead { background: #8b1f1f; color: #f6f2ea; }
          .exams-table th { padding: 12px 14px; font-weight: 700; font-size: 10.5pt; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; border: 1px solid #8b1f1f; }
          .exams-table tbody tr:nth-child(odd) { background: #faf8f3; }
          .exams-table tbody tr:nth-child(even) { background: #fff; }
          .exams-table tbody tr:hover { background: rgba(139, 31, 31, 0.06); }
          .exams-table tfoot tr { background: #f7f4ee; font-weight: 700; border-top: 2px solid #8b1f1f; }
          .exams-table tfoot td { padding: 12px 14px; border: 1px solid #d0d0d0; text-align: center; }
          .report-footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 2px solid #8b1f1f; font-size: 9pt; color: #6d6c68; }
          .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 10pt; }
          .status-paid { background: rgba(46, 125, 82, 0.15); color: #2e7d52; }
          .status-unpaid { background: rgba(139, 31, 31, 0.15); color: #8b1f1f; }
          @media print { body { background: #fff; padding: 0; } .report-container { width: 100%; box-shadow: none; padding: 20px; } }
        </style>
      </head>
      <body>
        <div class="report-container">
          <div class="report-header">
            <div class="report-title">${tr.pdfReportHeading || 'Student Report'}</div>
            <div class="student-name">${name}</div>
            <div class="student-grade">${tr.pdfGrade || 'Grade'}: ${gradeLabel(student.grade)}</div>
          </div>
          
          <div class="section-title">${tr.pdfAttendance || 'Attendance & Information'}</div>
          <table class="info-table">
            <tr>
              <td>${tr.pdfPresent || 'Present'}</td>
              <td>${student[SCHEMA.col.attendanceCount]}</td>
              <td>${tr.pdfAbsent || 'Absent'}</td>
              <td>${student[SCHEMA.col.absenceCount]}</td>
            </tr>
            <tr>
              <td>${tr.pdfRate || 'Attendance Rate'}</td>
              <td>${attendancePct != null ? attendancePct + "%" : "—"}</td>
              <td>${tr.pdfPayment || 'Payment Status'}</td>
              <td><span class="status-badge ${paid ? 'status-paid' : 'status-unpaid'}">${paymentLabel}</span></td>
            </tr>
            <tr>
              <td>${tr.pdfStudentPhone || 'Student Phone'}</td>
              <td>${student[SCHEMA.col.studentPhone] || "—"}</td>
              <td>${tr.pdfParentPhone || 'Parent Phone'}</td>
              <td>${student[SCHEMA.col.parentPhone] || "—"}</td>
            </tr>
            <tr>
              <td>${tr.pdfLastAttendance || 'Last Attendance'}</td>
              <td colspan="3">${student[SCHEMA.col.lastAttendance] || "—"}</td>
            </tr>
          </table>
          
          ${examRows.length > 0 ? `
          <div class="section-title">${tr.thExams || 'Exams'}</div>
          <table class="exams-table">
            <thead>
              <tr>
                <th>${tr.pdfExam || 'Exam'}</th>
                <th>${tr.pdfScore || 'Score'}</th>
                <th>${tr.pdfPct || 'Percentage'}</th>
              </tr>
            </thead>
            <tbody>
              ${examTableRows}
            </tbody>
            ${avgScore != null ? `
            <tfoot>
              <tr>
                <td>${tr.pdfAvg || 'Average'}</td>
                <td></td>
                <td>${avgScore}%</td>
              </tr>
            </tfoot>` : ""}
          </table>
          ` : `<div style="text-align:center; color:#6d6c68; padding:20px; border:1px dashed #d0d0d0; border-radius:8px; margin:20px 0;">${tr.noExamsYet || 'No exams yet'}</div>`}
          
          <div class="report-footer">
            ${tr.pdfFooter || 'Confidential Report'}
          </div>
        </div>
      </body>
      </html>
    `;
  }

  function downloadPdfReport(){
    if(!currentPdfBlob) return;
    const url = URL.createObjectURL(currentPdfBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = currentPdfFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function closePdfReportModal(){
    document.getElementById("pdfReportModalOverlay").classList.remove("show");
    currentPdfBlob = null;
  }

  (function init(){
    let savedLang = "ar", savedDark = false;
    try{
      savedLang = localStorage.getItem("studentSearchLang") || "ar";
      savedDark = localStorage.getItem("studentSearchDarkMode") === "1";
    }catch(e){}
    currentLang = savedLang;
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
    document.getElementById("langToggleBtn").textContent = currentLang === "ar" ? "EN" : "AR";
    if(savedDark){
      document.body.classList.add("dark");
      document.getElementById("darkModeToggle").textContent = "☀️";
    }
    applyStaticTranslations();
  })();

  loadData();
</script>
</body>
</html>
